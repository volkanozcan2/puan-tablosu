<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0F2017">
<meta name="color-scheme" content="dark">
<title>Puan Tablosu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F2017;
    --ink:#0C0F0A;
    --cream:#F1E9D4;
    --paper:#FBF7EC;
    --red:#E03A2B;
    --green:#1FA259;
    --gold:#EBB220;
    --chalk:#F1E9D4;
    --ink-dim:rgba(12,15,10,.58);
    --display:'Archivo Black','Arial Black',system-ui,sans-serif;
    --body:'Archivo','Arial',system-ui,sans-serif;
    --sh:7px 7px 0 var(--ink);
    --sh-sm:4px 4px 0 var(--ink);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{background:var(--bg);-webkit-text-size-adjust:100%;}
  body{
    font-family:var(--body);font-weight:600;
    color:var(--chalk);
    min-height:100vh;
    padding:20px 16px calc(40px + env(safe-area-inset-bottom));
    background-color:var(--bg);
    background-image:radial-gradient(rgba(241,233,212,.06) 1.4px, transparent 1.4px);
    background-size:24px 24px;
    -webkit-tap-highlight-color:transparent;
  }
  ::selection{background:var(--green);color:var(--ink);}
  .wrap{max-width:740px;margin:0 auto;}

  /* header */
  .board-head{
    display:flex;align-items:center;gap:16px;
    background:var(--red);
    border:4px solid var(--ink);box-shadow:var(--sh);
    padding:16px 20px;margin-bottom:24px;
    transform:rotate(-1deg);
  }
  .board-logo{width:74px;height:74px;flex:none;background:var(--cream);
    border:3px solid var(--ink);padding:4px;}
  .board-logo svg{width:100%;height:100%;display:block;animation:pop .5s cubic-bezier(.2,1.4,.4,1) both;}
  @keyframes pop{from{transform:scale(.4) rotate(-40deg);opacity:0;}to{transform:scale(1) rotate(0);opacity:1;}}
  .head-text h1{font-family:var(--display);font-size:clamp(28px,7vw,46px);
    line-height:.9;text-transform:uppercase;color:var(--cream);
    -webkit-text-stroke:1.5px var(--ink);letter-spacing:-1px;}
  .head-text p{font-family:var(--body);font-weight:800;font-size:12px;letter-spacing:2px;
    text-transform:uppercase;color:var(--ink);margin-top:7px;
    background:var(--gold);border:2px solid var(--ink);display:inline-block;padding:3px 8px;}

  .card{background:var(--cream);color:var(--ink);
    border:4px solid var(--ink);box-shadow:var(--sh);
    padding:22px;margin-bottom:20px;}

  label{display:block;font-family:var(--body);font-weight:800;font-size:13px;letter-spacing:1px;
    text-transform:uppercase;color:var(--ink);margin-bottom:9px;}
  input[type=text],input[type=number]{width:100%;
    font-family:var(--display);font-size:19px;
    padding:12px 14px;border:3px solid var(--ink);border-radius:0;
    background:var(--paper);color:var(--ink);accent-color:var(--green);
    margin-bottom:16px;outline:none;}
  input::placeholder{color:rgba(12,15,10,.34);}
  input:focus{background:var(--gold);}
  .row{display:flex;gap:14px;flex-wrap:wrap;}
  .row>div{flex:1;min-width:130px;}

  button{font-family:var(--display);font-size:16px;
    text-transform:uppercase;letter-spacing:.5px;
    padding:14px 18px;border:3px solid var(--ink);border-radius:0;
    cursor:pointer;color:var(--ink);background:var(--cream);box-shadow:var(--sh-sm);
    transition:transform .06s, box-shadow .06s;}
  button:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink);}
  button:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink);}
  button.full{width:100%;}
  button.red{background:var(--red);color:var(--cream);}
  button.green{background:var(--green);color:var(--cream);}
  button.gold{background:var(--gold);}
  button.ghost{background:var(--paper);}
  button.small{font-size:13px;padding:11px 14px;}

  .toggle{display:flex;gap:0;margin-bottom:20px;border:3px solid var(--ink);box-shadow:var(--sh-sm);}
  .toggle button{flex:1;border:none;box-shadow:none;background:var(--paper);border-right:3px solid var(--ink);}
  .toggle button:last-child{border-right:none;}
  .toggle button:hover,.toggle button:active{transform:none;box-shadow:none;}
  .toggle button.on{background:var(--red);color:var(--cream);}

  .player-fields{margin-bottom:12px;}
  .player-input-row{display:flex;gap:12px;align-items:center;margin-bottom:11px;}
  .player-input-row .num{font-family:var(--display);font-size:16px;
    width:38px;height:38px;flex:none;border-radius:50%;
    background:var(--red);color:var(--cream);border:3px solid var(--ink);
    display:flex;align-items:center;justify-content:center;}
  .player-input-row input{margin-bottom:0;}

  .group-block{border:3px solid var(--ink);background:var(--paper);padding:15px;margin-bottom:14px;box-shadow:var(--sh-sm);}
  .group-block .ghead{display:flex;gap:11px;align-items:center;margin-bottom:13px;}
  .group-block .gtag{font-family:var(--display);font-size:13px;letter-spacing:.5px;text-transform:uppercase;
    color:var(--ink);background:var(--gold);border:3px solid var(--ink);padding:5px 10px;flex:none;}
  .group-block input{margin-bottom:0;}
  .member-row{display:flex;gap:10px;align-items:center;margin-bottom:8px;}
  .member-row .dot{width:26px;height:26px;flex:none;border-radius:50%;
    background:var(--green);border:3px solid var(--ink);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--cream);}

  .turnbar{display:flex;justify-content:space-between;align-items:center;
    background:var(--gold);border:4px solid var(--ink);box-shadow:var(--sh);
    padding:14px 22px;margin-bottom:20px;}
  .turnbar .lbl{font-family:var(--body);font-weight:800;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--ink);}
  .turnbar .big{font-family:var(--display);font-size:34px;color:var(--ink);}
  .turnbar .big .sep{color:var(--red);}

  .score-line{display:flex;gap:12px;align-items:center;margin-bottom:11px;}
  .score-line .name{flex:1;background:var(--paper);border:3px solid var(--ink);padding:12px 15px;
    font-family:var(--display);font-size:18px;color:var(--ink);}
  .score-line .name .tot{font-family:var(--body);font-size:12px;font-weight:800;color:var(--ink-dim);}
  .score-line .name .mem{display:block;font-family:var(--body);font-weight:700;font-size:12px;color:var(--ink-dim);margin-top:2px;}
  .score-line input{width:104px;margin-bottom:0;flex:none;text-align:center;font-size:22px;}

  .stand-item{display:flex;align-items:center;gap:13px;border:3px solid var(--ink);background:var(--paper);
    padding:11px 14px;margin-bottom:10px;box-shadow:var(--sh-sm);}
  .stand-item .rank{width:38px;height:38px;flex:none;border-radius:50%;
    background:var(--ink);color:var(--cream);border:3px solid var(--ink);
    display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:17px;}
  .stand-item .pname{flex:1;font-family:var(--display);font-size:18px;color:var(--ink);}
  .stand-item .pname .mem{display:block;font-family:var(--body);font-weight:700;font-size:12px;color:var(--ink-dim);margin-top:2px;}
  .stand-item .pts{font-family:var(--display);font-size:24px;color:var(--ink);}
  .stand-item.lead{background:var(--green);}
  .stand-item.lead .rank{background:var(--red);}
  .stand-item.lead .pname,.stand-item.lead .pts{color:var(--cream);}
  .stand-item.lead .pname .mem{color:rgba(241,233,212,.8);}

  .winner{text-align:center;background:var(--gold);border:4px solid var(--ink);box-shadow:var(--sh);
    padding:20px;margin-bottom:22px;transform:rotate(-1deg);
    animation:winnerIn .6s cubic-bezier(.18,1.5,.4,1) both;}
  @keyframes winnerIn{
    0%{transform:rotate(-1deg) scale(.4);opacity:0;}
    60%{transform:rotate(-1deg) scale(1.08);opacity:1;}
    100%{transform:rotate(-1deg) scale(1);opacity:1;}
  }
  .winner .shot{font-family:var(--display);font-size:clamp(18px,5vw,26px);
    text-transform:uppercase;color:var(--ink);line-height:1;letter-spacing:2px;
    animation:capPop .5s .15s ease-out both;}
  @keyframes capPop{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
  .winner .dartline{font-size:38px;margin:6px 0 2px;display:inline-block;
    animation:dartSpin .7s .2s cubic-bezier(.2,1.4,.4,1) both;}
  @keyframes dartSpin{0%{transform:scale(0) rotate(-180deg);}70%{transform:scale(1.3) rotate(10deg);}100%{transform:scale(1) rotate(0);}}
  .winner .who{font-family:var(--display);font-size:clamp(28px,8vw,50px);
    text-transform:uppercase;color:var(--ink);line-height:1;margin:6px 0;word-break:break-word;
    -webkit-text-stroke:1px var(--ink);
    animation:whoPop .55s .35s cubic-bezier(.18,1.6,.4,1) both;}
  @keyframes whoPop{0%{opacity:0;transform:scale(.5);}65%{opacity:1;transform:scale(1.12);}100%{transform:scale(1);}}
  .winner .mem{font-family:var(--body);font-weight:800;font-size:13px;color:var(--ink);
    animation:capPop .5s .5s ease-out both;}
  .winner .pts{font-family:var(--display);font-size:20px;color:var(--ink);margin-top:6px;
    animation:capPop .5s .58s ease-out both;}

  .section-cap{font-family:var(--body);font-weight:800;font-size:13px;letter-spacing:1px;
    text-transform:uppercase;color:var(--ink);margin-bottom:12px;}

  .podium{display:flex;gap:12px;align-items:flex-end;justify-content:center;margin:6px 0 18px;flex-wrap:wrap;}
  .pod{border:3px solid var(--ink);box-shadow:var(--sh-sm);padding:14px 12px;text-align:center;min-width:116px;flex:1;background:var(--paper);}
  .pod .medal{font-size:30px;}
  .pod .pn{font-family:var(--display);font-size:16px;color:var(--ink);margin:6px 0 2px;word-break:break-word;}
  .pod .mem{font-family:var(--body);font-weight:700;font-size:11px;color:var(--ink-dim);margin-bottom:4px;}
  .pod .ps{font-family:var(--display);font-size:15px;color:var(--ink);}
  .pod.p1{order:2;background:var(--gold);padding-bottom:34px;}
  .pod.p2{order:1;background:var(--paper);padding-bottom:22px;}
  .pod.p3{order:3;background:#CDE8D7;padding-bottom:14px;}

  .rest-row{display:flex;justify-content:space-between;align-items:center;gap:10px;
    border:3px solid var(--ink);background:var(--paper);padding:11px 14px;margin-bottom:10px;
    font-family:var(--display);font-size:18px;color:var(--ink);}
  .rest-row .left{display:flex;gap:10px;align-items:baseline;}
  .rest-row .rk{color:var(--red);}
  .rest-row .mem{font-family:var(--body);font-weight:700;font-size:12px;color:var(--ink-dim);}

  .addround{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px;}
  .addround input{margin-bottom:0;flex:none;width:88px;text-align:center;}
  .addround button{flex:1;min-width:148px;}

  .savestat{font-family:var(--body);font-weight:800;font-size:12px;letter-spacing:.5px;
    text-transform:uppercase;margin:16px 0 4px;padding:8px 12px;display:inline-block;border:3px solid var(--ink);color:var(--ink);}
  .savestat.ok{background:var(--green);color:var(--cream);}
  .savestat.busy{background:var(--paper);}
  .savestat.fail{background:var(--red);color:var(--cream);}

  .hist-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
  .hist-game{border:3px solid var(--ink);background:var(--paper);margin-bottom:13px;box-shadow:var(--sh-sm);}
  .hist-top{display:flex;justify-content:space-between;align-items:center;gap:11px;padding:13px 14px;cursor:pointer;}
  .hist-top:hover{background:#fff;}
  .hist-when{font-family:var(--body);font-weight:800;font-size:11px;letter-spacing:.5px;color:var(--ink-dim);text-transform:uppercase;}
  .hist-win{font-family:var(--display);font-size:18px;color:var(--ink);margin-top:3px;}
  .hist-badge{font-family:var(--body);font-weight:800;font-size:10px;letter-spacing:.5px;text-transform:uppercase;
    padding:4px 8px;flex:none;border:3px solid var(--ink);color:var(--ink);}
  .hist-badge.solo{background:var(--green);color:var(--cream);}
  .hist-badge.group{background:var(--gold);}
  .hist-body{padding:4px 14px 14px;border-top:3px solid var(--ink);}
  .hist-line{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:2px dotted rgba(12,15,10,.3);
    font-family:var(--display);font-size:16px;color:var(--ink);}
  .hist-line:last-of-type{border-bottom:none;}
  .hist-line .lk{color:var(--red);margin-right:7px;}
  .hist-line .mem{font-family:var(--body);font-weight:700;font-size:12px;color:var(--ink-dim);}
  .hist-del{font-family:var(--body);font-weight:800;font-size:11px;letter-spacing:.5px;text-transform:uppercase;
    background:var(--paper);border:3px solid var(--ink);color:var(--ink);padding:8px 12px;cursor:pointer;margin-top:12px;}
  .hist-del:hover{background:var(--red);color:var(--cream);}
  .muted{font-family:var(--body);font-weight:700;color:var(--ink-dim);padding:12px 0;line-height:1.5;}

  #toast{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-180%);
    background:var(--gold);border:3px solid var(--ink);color:var(--ink);box-shadow:var(--sh-sm);
    font-family:var(--display);text-transform:uppercase;letter-spacing:.5px;
    padding:13px 22px;z-index:10000;transition:transform .35s cubic-bezier(.2,1.5,.4,1);white-space:nowrap;font-size:16px;}
  #toast.show{transform:translateX(-50%) translateY(0);}

  #confetti{position:fixed;inset:0;pointer-events:none;z-index:9999;}
  .hide{display:none;}
  .err{color:#fff;background:var(--red);border:3px solid var(--ink);font-family:var(--body);font-weight:800;
    font-size:13px;padding:8px 12px;margin-bottom:12px;display:inline-block;}

  @media (prefers-reduced-motion:reduce){
    .board-logo svg{animation:none;}
    .board-head,.winner{transform:none;}
    .winner,.winner .shot,.winner .dartline,.winner .who,.winner .mem,.winner .pts{animation:none;}
    button:hover{transform:none;box-shadow:var(--sh-sm);}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="board-head">
    <div class="board-logo" id="boardLogo"></div>
    <div class="head-text">
      <h1>Puan Tablosu</h1>
    </div>
  </header>

  <!-- ADIM 1: KURULUM -->
  <div id="setup" class="card">
    <label>Oyun tipi</label>
    <div class="toggle">
      <button id="modeSolo" class="on" onclick="setMode('solo')">Bireysel</button>
      <button id="modeGroup" onclick="setMode('group')">Grup</button>
    </div>
    <div class="row">
      <div>
        <label id="countLabel">Kaç kişi?</label>
        <input type="number" id="unitCount" min="2" max="12" value="3">
      </div>
      <div id="sizeWrap" class="hide">
        <label>Grup başına kişi?</label>
        <input type="number" id="groupSize" min="1" max="10" value="2">
      </div>
      <div>
        <label>Kaç tur?</label>
        <input type="number" id="roundCount" min="1" max="50" value="5">
      </div>
    </div>
    <button class="full red" onclick="buildEntryFields()">Oyuncuları Gir →</button>
    <button class="full ghost small" style="margin-top:12px;" onclick="openHistory('setup')">◎ Geçmiş Maçlar</button>
  </div>

  <!-- ADIM 2: İSİMLER -->
  <div id="names" class="card hide">
    <label id="namesLabel">Oyuncu isimleri</label>
    <div id="entryFields"></div>
    <div id="nameErr" class="err hide">Boş alan var, hepsini doldur.</div>
    <button class="full green" onclick="startGame()">Oyunu Başlat ▸</button>
  </div>

  <!-- ADIM 3: OYUN -->
  <div id="game" class="hide">
    <div class="turnbar">
      <span class="lbl">Tur</span>
      <span class="big"><span id="curRound">1</span><span class="sep"> / </span><span id="totRound">5</span></span>
    </div>
    <div class="card">
      <div class="section-cap">Bu turun skorları</div>
      <div id="scoreInputs"></div>
      <div id="scoreErr" class="err hide">Boş kutu var, hepsine sayı yaz.</div>
      <button class="full green" id="turnBtn" onclick="submitTurn()">Turu Kaydet</button>
    </div>
    <div class="card">
      <div class="section-cap">Anlık sıralama</div>
      <div id="standings"></div>
    </div>
  </div>

  <!-- ADIM 4: SONUÇ -->
  <div id="results" class="card hide">
    <div id="winner" class="winner"></div>
    <div class="section-cap">Tam sıralama</div>
    <div id="podium" class="podium"></div>
    <div id="restList"></div>
    <div><span id="saveStat" class="savestat busy hide"></span></div>
    <div class="addround">
      <input type="number" id="extraRounds" min="1" max="20" value="1">
      <button class="gold" onclick="addRounds()">+ Tur Ekle</button>
    </div>
    <div class="addround">
      <button class="ghost" onclick="openHistory('results')">◎ Geçmiş</button>
      <button class="ghost" onclick="location.reload()">↺ Yeniden Oyna</button>
    </div>
  </div>

  <!-- GEÇMİŞ -->
  <div id="history" class="card hide">
    <div class="hist-head">
      <label style="margin:0;">Geçmiş maçlar</label>
      <button class="ghost small" onclick="closeHistory()">← Geri</button>
    </div>
    <div id="histList"><div class="muted">Yükleniyor…</div></div>
    <button id="clearAllBtn" class="hist-del hide" style="margin-top:14px;" onclick="clearHistory()">Tümünü Sil</button>
  </div>
</div>

<div id="toast"></div>
<canvas id="confetti"></canvas>

<script>
const API = "/api/scores";

let mode = 'solo';
let units = [];
let totalRounds = 0;
let currentRound = 1;
let savedThisGame = false;
let historyReturnTo = 'setup';

function dartboardSVG(){
  const cx=100, cy=100;
  const cream='#F1E9D4', black='#0C0F0A', red='#E03A2B', green='#1FA259';
  const wire='rgba(12,15,10,.6)';
  const segs=20, step=Math.PI*2/segs, start=-Math.PI/2 - step/2;
  const pt=(r,a)=>[cx+r*Math.cos(a), cy+r*Math.sin(a)];
  function sector(r1,r2,a1,a2,fill){
    const [x1,y1]=pt(r2,a1),[x2,y2]=pt(r2,a2),[x3,y3]=pt(r1,a2),[x4,y4]=pt(r1,a1);
    return `<path d="M${x1.toFixed(2)} ${y1.toFixed(2)} A${r2} ${r2} 0 0 1 ${x2.toFixed(2)} ${y2.toFixed(2)} L${x3.toFixed(2)} ${y3.toFixed(2)} A${r1} ${r1} 0 0 0 ${x4.toFixed(2)} ${y4.toFixed(2)} Z" fill="${fill}" stroke="${wire}" stroke-width="0.7"/>`;
  }
  let p='';
  for(let i=0;i<segs;i++){
    const a1=start+i*step, a2=a1+step, c=i%2===0;
    p+=sector(12.5,86,a1,a2, c?cream:black);
    p+=sector(86,95,a1,a2, c?green:red);
    p+=sector(50,56,a1,a2, c?green:red);
  }
  const rim=`<circle cx="${cx}" cy="${cy}" r="97" fill="none" stroke="${black}" stroke-width="6"/>`;
  const bull=`<circle cx="${cx}" cy="${cy}" r="12.5" fill="${green}" stroke="${wire}" stroke-width="0.7"/>`+
             `<circle cx="${cx}" cy="${cy}" r="5.5" fill="${red}" stroke="${wire}" stroke-width="0.7"/>`;
  const dart=`<g transform="rotate(-34 100 100)">
      <polygon points="100,96 97.5,86 102.5,86" fill="#cfd3d8" stroke="${black}" stroke-width="0.6"/>
      <rect x="98" y="40" width="4" height="46" rx="1" fill="#b9bdc4" stroke="${black}" stroke-width="0.6"/>
      <rect x="98.6" y="30" width="2.8" height="12" fill="#8d9197"/>
      <polygon points="100,16 92,30 100,27 108,30" fill="#E03A2B" stroke="${black}" stroke-width="0.6"/>
    </g>`;
  return `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">${rim}${p}${bull}${dart}</svg>`;
}
document.getElementById('boardLogo').innerHTML = dartboardSVG();

function setMode(m){
  mode = m;
  document.getElementById('modeSolo').classList.toggle('on', m==='solo');
  document.getElementById('modeGroup').classList.toggle('on', m==='group');
  document.getElementById('sizeWrap').classList.toggle('hide', m==='solo');
  document.getElementById('countLabel').textContent = (m==='group') ? 'Kaç grup?' : 'Kaç kişi?';
}

function buildEntryFields(){
  const n = Math.max(2, Math.min(12, parseInt(document.getElementById('unitCount').value)||2));
  totalRounds = Math.max(1, Math.min(50, parseInt(document.getElementById('roundCount').value)||1));
  const box = document.getElementById('entryFields');
  box.innerHTML = '';
  if(mode === 'solo'){
    document.getElementById('namesLabel').textContent = 'Oyuncu isimleri';
    for(let i=0;i<n;i++){
      box.innerHTML += `
        <div class="player-input-row">
          <span class="num">${i+1}</span>
          <input type="text" class="soloName" placeholder="Oyuncu ${i+1}">
        </div>`;
    }
  } else {
    const size = Math.max(1, Math.min(10, parseInt(document.getElementById('groupSize').value)||1));
    document.getElementById('namesLabel').textContent = 'Grup adı ve üyeleri';
    for(let g=0;g<n;g++){
      let members = '';
      for(let k=0;k<size;k++){
        members += `
          <div class="member-row">
            <span class="dot">${k+1}</span>
            <input type="text" class="member" data-g="${g}" placeholder="Üye ${k+1}">
          </div>`;
      }
      box.innerHTML += `
        <div class="group-block" data-g="${g}">
          <div class="ghead">
            <span class="gtag">Grup ${g+1}</span>
            <input type="text" class="groupName" data-g="${g}" placeholder="Grup adı">
          </div>
          ${members}
        </div>`;
    }
  }
  document.getElementById('setup').classList.add('hide');
  document.getElementById('names').classList.remove('hide');
}

function startGame(){
  units = [];
  let ok = true;
  if(mode === 'solo'){
    document.querySelectorAll('.soloName').forEach(inp=>{
      const v = inp.value.trim();
      if(!v) ok=false;
      units.push({name:v, members:[], total:0});
    });
  } else {
    document.querySelectorAll('.group-block').forEach(block=>{
      const gName = block.querySelector('.groupName').value.trim();
      if(!gName) ok=false;
      const members = [];
      block.querySelectorAll('.member').forEach(mi=>{
        const mv = mi.value.trim();
        if(!mv) ok=false;
        members.push(mv);
      });
      units.push({name:gName, members:members, total:0});
    });
  }
  if(!ok){ document.getElementById('nameErr').classList.remove('hide'); return; }

  savedThisGame = false;
  currentRound = 1;
  document.getElementById('totRound').textContent = totalRounds;
  document.getElementById('names').classList.add('hide');
  document.getElementById('game').classList.remove('hide');
  renderTurn();
  renderStandings();
}

function memLine(u){
  return (u.members && u.members.length) ? `<span class="mem">${u.members.map(escapeHtml).join(' · ')}</span>` : '';
}

function renderTurn(){
  document.getElementById('curRound').textContent = currentRound;
  const box = document.getElementById('scoreInputs');
  box.innerHTML = '';
  units.forEach((u,i)=>{
    box.innerHTML += `
      <div class="score-line">
        <div class="name">${escapeHtml(u.name)} <span class="tot">(top ${fmt(u.total)})</span>${memLine(u)}</div>
        <input type="number" class="turnScore" data-i="${i}" placeholder="0">
      </div>`;
  });
  document.getElementById('turnBtn').textContent =
    (currentRound === totalRounds) ? 'Son Turu Kaydet' : 'Turu Kaydet';
}

function submitTurn(){
  const inputs = document.querySelectorAll('.turnScore');
  let ok = true;
  inputs.forEach(inp=>{ if(inp.value.trim()==='') ok=false; });
  if(!ok){ document.getElementById('scoreErr').classList.remove('hide'); return; }
  document.getElementById('scoreErr').classList.add('hide');

  let got180 = false;
  inputs.forEach(inp=>{
    const i = parseInt(inp.dataset.i);
    const val = parseFloat(inp.value)||0;
    if(val === 180) got180 = true;
    units[i].total += val;
  });
  if(got180) showToast('One Hundred and Eighty! 🎯');

  renderStandings();
  if(currentRound >= totalRounds){ showResults(); return; }
  currentRound++;
  renderTurn();
}

function renderStandings(){
  const sorted = [...units].sort((a,b)=>b.total-a.total);
  const box = document.getElementById('standings');
  box.innerHTML = '';
  sorted.forEach((u,i)=>{
    box.innerHTML += `
      <div class="stand-item ${i===0?'lead':''}">
        <div class="rank">${i+1}</div>
        <div class="pname">${escapeHtml(u.name)}${memLine(u)}</div>
        <div class="pts">${fmt(u.total)}</div>
      </div>`;
  });
}

function showResults(){
  document.getElementById('game').classList.add('hide');
  document.getElementById('results').classList.remove('hide');

  const sorted = [...units].sort((a,b)=>b.total-a.total);
  const topScore = sorted[0].total;
  const champs = sorted.filter(u=>u.total===topScore);
  const win = document.getElementById('winner');
  if(champs.length === 1){
    const w = champs[0];
    win.innerHTML = `
      <div class="shot">Kazanan</div>
      <div class="dartline">🎯</div>
      <div class="who">${escapeHtml(w.name)}</div>
      ${w.members.length?`<div class="mem">${w.members.map(escapeHtml).join(' · ')}</div>`:''}
      <div class="pts">${fmt(w.total)} puan</div>`;
  } else {
    win.innerHTML = `
      <div class="shot">Berabere</div>
      <div class="dartline">🎯</div>
      <div class="who">${champs.map(c=>escapeHtml(c.name)).join(' & ')}</div>
      <div class="pts">${fmt(topScore)} puan</div>`;
  }

  const medals = ['🥇','🥈','🥉'];
  const pod = document.getElementById('podium');
  pod.innerHTML = '';
  sorted.slice(0,3).forEach((u,i)=>{
    pod.innerHTML += `
      <div class="pod p${i+1}">
        <div class="medal">${medals[i]}</div>
        <div class="pn">${escapeHtml(u.name)}</div>
        ${u.members.length?`<div class="mem">${u.members.map(escapeHtml).join(' · ')}</div>`:''}
        <div class="ps">${fmt(u.total)} puan</div>
      </div>`;
  });

  const rest = document.getElementById('restList');
  rest.innerHTML = '';
  sorted.slice(3).forEach((u,i)=>{
    rest.innerHTML += `
      <div class="rest-row">
        <span class="left">
          <span class="rk">${i+4}.</span>
          <span>${escapeHtml(u.name)}${u.members.length?` <span class="mem">(${u.members.map(escapeHtml).join(' · ')})</span>`:''}</span>
        </span>
        <span>${fmt(u.total)} puan</span>
      </div>`;
  });

  fireConfetti();
  saveGame(sorted);

  // kazanan kutusunun animasyonunu her seferinde yeniden tetikle
  win.style.animation = 'none';
  void win.offsetWidth;
  win.style.animation = '';
}

async function saveGame(sorted){
  if(savedThisGame) return;
  const stat = document.getElementById('saveStat');
  stat.classList.remove('hide');
  stat.className = 'savestat busy';
  stat.textContent = 'Kaydediliyor…';
  const payload = {
    mode, rounds: totalRounds,
    results: sorted.map((u,i)=>({ rank:i+1, name:u.name, members:u.members, total:u.total }))
  };
  try{
    const res = await fetch(API, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(!res.ok) throw new Error('HTTP '+res.status);
    savedThisGame = true;
    stat.className = 'savestat ok';
    stat.textContent = '✓ Geçmişe kaydedildi';
  }catch(e){
    stat.className = 'savestat fail';
    stat.textContent = '⚠ Kaydedilemedi (çevrimdışı)';
  }
}

function addRounds(){
  const add = Math.max(1, Math.min(20, parseInt(document.getElementById('extraRounds').value)||1));
  totalRounds += add;
  currentRound += 1;
  savedThisGame = false;
  document.getElementById('saveStat').classList.add('hide');
  document.getElementById('totRound').textContent = totalRounds;
  document.getElementById('results').classList.add('hide');
  document.getElementById('game').classList.remove('hide');
  renderTurn();
  renderStandings();
  window.scrollTo({top:0, behavior:'smooth'});
}

function openHistory(from){
  historyReturnTo = from || 'setup';
  document.getElementById('setup').classList.add('hide');
  document.getElementById('results').classList.add('hide');
  document.getElementById('history').classList.remove('hide');
  loadHistory();
  window.scrollTo({top:0, behavior:'smooth'});
}
function closeHistory(){
  document.getElementById('history').classList.add('hide');
  document.getElementById(historyReturnTo).classList.remove('hide');
}

async function loadHistory(){
  const list = document.getElementById('histList');
  const clearBtn = document.getElementById('clearAllBtn');
  clearBtn.classList.add('hide');
  list.innerHTML = '<div class="muted">Yükleniyor…</div>';
  try{
    const res = await fetch(API);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const games = await res.json();
    if(!games.length){
      list.innerHTML = '<div class="muted">Kayıtlı maç yok.</div>';
      return;
    }
    list.innerHTML = '';
    games.forEach(g=>{
      const top = g.results && g.results[0];
      const champs = (g.results||[]).filter(r=>top && r.total===top.total);
      const winTxt = champs.length>1 ? champs.map(c=>escapeHtml(c.name)).join(' & ') : (top ? escapeHtml(top.name) : '—');
      const lines = (g.results||[]).map(r=>`
        <div class="hist-line">
          <span><span class="lk">${r.rank}.</span>${escapeHtml(r.name)}${r.members&&r.members.length?` <span class="mem">(${r.members.map(escapeHtml).join(' · ')})</span>`:''}</span>
          <span>${fmt(r.total)}</span>
        </div>`).join('');
      list.innerHTML += `
        <div class="hist-game">
          <div class="hist-top" onclick="this.nextElementSibling.classList.toggle('hide')">
            <div>
              <div class="hist-when">${fmtDate(g.savedAt)} · ${g.rounds} tur</div>
              <div class="hist-win">🎯 ${winTxt}</div>
            </div>
            <span class="hist-badge ${g.mode}">${g.mode==='group'?'Grup':'Bireysel'}</span>
          </div>
          <div class="hist-body hide">
            ${lines}
            <button class="hist-del" onclick="deleteGame('${g.id}')">Bu Maçı Sil</button>
          </div>
        </div>`;
    });
    clearBtn.classList.remove('hide');
  }catch(e){
    list.innerHTML = '<div class="muted">Geçmiş yüklenemedi. Site Netlify üzerinde çalışıyorsa tekrar dene.</div>';
  }
}

const DELETE_PASSWORD = "dartdart";
function checkDeletePassword(){
  const entry = prompt("Silmek için şifre girin:");
  if(entry === null) return false;            // iptal
  if(entry === DELETE_PASSWORD) return true;
  alert("Şifre yanlış.");
  return false;
}

async function deleteGame(id){
  if(!checkDeletePassword()) return;
  try{ await fetch(API+'?id='+encodeURIComponent(id), {method:'DELETE'}); loadHistory(); }catch(e){}
}
async function clearHistory(){
  if(!checkDeletePassword()) return;
  if(!confirm('Tüm geçmiş maçlar silinsin mi?')) return;
  try{ await fetch(API+'?all=1', {method:'DELETE'}); loadHistory(); }catch(e){}
}

let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}

function fmt(n){ return Number.isInteger(n)? n : n.toFixed(1); }
function fmtDate(ms){
  try{ return new Date(ms).toLocaleString('tr-TR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
  catch(e){ return ''; }
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fireConfetti(){
  if(matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = document.getElementById('confetti');
  const ctx = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight;
  const colors = ['#E03A2B','#1FA259','#EBB220','#F1E9D4','#0C0F0A'];
  const bits = [];
  for(let i=0;i<170;i++){
    bits.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*0.5,
      w:7+Math.random()*9,h:10+Math.random()*9,c:colors[(Math.random()*colors.length)|0],
      vy:2.4+Math.random()*4,vx:-2+Math.random()*4,rot:Math.random()*6.28,vr:-0.2+Math.random()*0.4});
  }
  const start=performance.now(), DUR=3800;
  function frame(t){
    ctx.clearRect(0,0,cv.width,cv.height);
    bits.forEach(b=>{
      b.x+=b.vx;b.y+=b.vy;b.rot+=b.vr;b.vy+=0.04;
      ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.rot);
      ctx.fillStyle=b.c;ctx.fillRect(-b.w/2,-b.h/2,b.w,b.h);ctx.restore();
    });
    if(t-start<DUR) requestAnimationFrame(frame);
    else ctx.clearRect(0,0,cv.width,cv.height);
  }
  requestAnimationFrame(frame);
}
</script>
